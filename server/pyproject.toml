[project]
name = "intervals-mcp"
version = "0.1.0"
description = "MCP server exposing intervals.icu via Keycloak-authenticated OAuth 2.1"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["intervals_mcp"]
